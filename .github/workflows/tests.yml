name: CI - Tests

on:
  push:
    branches: [main, develop, "feat/**"]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar pruebas con cobertura
        run: |
          pytest tests/ --cov=src --cov-report=term-missing

      - name: Linting
        run: |
          pylint src/ --exit-zero

  simulation-service:
    # pruebas del servicio de simulación (pipeline, API, 3D); SUMO llega con el paquete eclipse-sumo
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simulation-service

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: simulation-service/pyproject.toml

      - name: Instalar el servicio
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ejecutar pruebas
        run: pytest -v
